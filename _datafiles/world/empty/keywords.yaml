# Help targets for the help  help <target>
# Looks for a template file: _datafiles/templates/help/<command>.template


help:
  command:
    configuration:
      - alias
      - macros
      - set
      - password
    character:
      - actionpoints
      - alignment
      - inventory
      - keyring
      - encumbrance
      - death
      - stats
    communication:
      - emote
      - say
      - shout
      - broadcast
      - whisper
    combat:
      - attack
      - consider
      - flee
      - shoot
    information:
      - biome
      - exits
      - help
      - look
      - online
      - races
      - who
      - history
      - visited
    items:
      - drop
      - equip
      - get
      - give
      - remove
      - show
      - read
      - put
    general:
      - online
      - quit
    parties:
      - party
    locks:
      - lock
      - unlock
  admin:
    all:
      - badcommands
      - build
      - command
      - copyover
      - item
      - grant
      - locate
      - mob
      - modify
      - mute
      - prepare
      - redescribe
      - reload
      - rename
      - room
      - server
      - spawn
      - syslogs
      - teleport
      - unmute
      - zone
      - visit
# Aliases for keywords when typing: help <keyword>
# Key is the target keyword, value is the list of aliases
help-aliases:
  strength:         [str]
  vitality:         [vit]
  speed:            [spd, spe]
  mysticism:        [mys, myst]
  smarts:           [smt, sma]
  perception:       [per, percep, percept]
  health:           [hp]
  mana:             [mp]
  races:            [race]
  keyring:          [key, keys]
  equip:            [wear, wield, hold]
  set-prompt:       [prompt]
  set-wimpy:        [wimpy]
  colors:           [color, ansi]
  macros:           [macro]
  history:          ['log']
  about:            ['gomud']
  stats:            [stat, attributes, attrs]
# Default aliases for commands
# For example: inv -> inventory
# They can be command + argument aliases
# Key is the target command, value is the list of aliases
command-aliases:
  say:                ['.']
  broadcast:          ['`']
  inventory:          ['i', 'inv', 'eq']
  look:               ['l', 'examine']
  go:                 ['enter']
  equip:              ['wear', 'wield', 'hold']
  remove:             ['rem', 'unequip', 'unwear', 'unwield']
  attack:             ['a', 'k', 'kill', 'fight']
  get:                ['g', 'take']
  command:            ['cmd']
  macros:             ['=?', 'macro']
  shout:              ['yell', 'scream', 'holler']
  keyring:            ['key', 'keys']
  whisper:            ['/w']
  unlock:             ['open']
  put:                ['place']
  history:            ['log']
  noop:               ['wake']
  syslogs:            ['syslog']
  'party chat':       ['pchat', 'psay']
  'help about':       ['about']
  'set screenreader': ['screenreader']
  'consider':         ['con']

  # Direction aliases
direction-aliases:
  n:  north
  s:  south
  e:  east
  w:  west
  u:  up
  d:  down
  nw: northwest
  ne: northeast
  sw: southwest
  se: southeast

# Special map symbols that will always show this exact text if found on a map.
# Group under zone names.
# '*' entries apply everywhere, unless overridden by a zone entry
legend-overrides:
  '*':
    'G': 'Gate'
    '✗': 'Target'
    '?': 'Secret'
