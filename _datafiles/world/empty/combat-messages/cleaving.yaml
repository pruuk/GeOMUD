# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: cleaving
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing {target} for battle.'
      - 'You ready your <ansi fg="item">{itemname}</ansi>, preparing to cleave {target}.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} hefts their <ansi fg="item">{itemname}</ansi>, eyeing you menacingly.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> and focuses on you.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} grips their <ansi fg="item">{itemname}</ansi> tightly, preparing to engage {target}.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi>, eyes fixed on {target}.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You circle around {target}, looking for an opening.'
      - 'You watch {target} closely, waiting for the perfect moment to strike.'
      todefender:
      - '{actor} circles dangerously.'
      - '{actor} watches you intently, their <ansi fg="item">{itemname}</ansi> at the ready.'
      - '{actor} holds their <ansi fg="item">{itemname}</ansi> steady, eyeing you carefully.'
      toroom:
      - '{actor} circles {target} with cruel intentions.'
      - '{actor} stalks around {target}, awaiting an opportunity.'
      - '{actor} eyes {target} warily, ready to cleave.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You heave your <ansi fg="item">{itemname}</ansi> at {target}, but they easily dodge!'
      - 'Your swing at {target} misses completely!'
      - 'You attempt to cleave {target}, but fail to connect!'
      todefender:
      - '{actor} heaves <ansi fg="item">{itemname}</ansi> at you, but you easily dodge!'
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> wildly, missing you entirely.'
      - '{actor} tries to cleave you but misses!'
      toroom:
      - '{actor} heaves <ansi fg="item">{itemname}</ansi> at {target}, but they easily dodge!'
      - '{actor} swings at {target} but misses completely.'
      - '{actor} attempts to cleave {target} but fails to connect!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You heave your <ansi fg="item">{itemname}</ansi> at {target}, but it bounces off for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> barely scratches {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a weak blow on {target}, dealing only <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor} heaves their <ansi fg="item">{itemname}</ansi> but does barely <ansi fg="damage">{damage} damage</ansi> to you.'
      - 'You feel a light impact as {actor} strikes you for <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} lands a weak hit on you, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor} heaves their <ansi fg="item">{itemname}</ansi> but does barely any damage to {target}.'
      - '{actor} barely scratches {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} lands a weak blow on {target}.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You chop {target} with your <ansi fg="item">{itemname}</ansi> and hit for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> strikes {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a solid hit on {target} with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} chops you with their <ansi fg="item">{itemname}</ansi> and hits for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} strikes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit by {actor}''s <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} chops {target} with their <ansi fg="item">{itemname}</ansi> and hits!'
      - '{actor} strikes {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} hits {target} solidly with their <ansi fg="item">{itemname}</ansi>!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> cleaves {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful blow to {target}, cleaving them for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your swing cleaves deeply into {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> cleaves you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} delivers a powerful cleaving blow, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are cleaved deeply by {actor} for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> cleaves {target}!'
      - '{actor} delivers a powerful cleaving blow to {target}!'
      - '{actor} cleaves deeply into {target} with their <ansi fg="item">{itemname}</ansi>!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY PULVERIZES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You <ansi fg="cyan-bold">DEVASTATE</ansi> {target} with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL CLEAVE</ansi> to {target} for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY PULVERIZES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">DEVASTATED</ansi> by {actor}''s <ansi fg="item">{itemname}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} delivers a <ansi fg="cyan-bold">CRITICAL CLEAVE</ansi>, causing you <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY PULVERIZES</ansi> {target}!'
      - '{actor} <ansi fg="cyan-bold">DEVASTATES</ansi> {target} with a critical cleave!'
      - '{actor} delivers a <ansi fg="cyan-bold">CRITICAL CLEAVE</ansi> to {target}!'
