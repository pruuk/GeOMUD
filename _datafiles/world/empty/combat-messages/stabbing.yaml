# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: stabbing
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You ready your <ansi fg="item">{itemname}</ansi> against {target}.'
      - 'You brace yourself for battle with {target}.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} eyes you warily, gripping their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} assumes a fighting stance against you.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> against {target}.'
      - '{actor} braces for combat with {target}.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You watch {target} closely, looking for an opening.'
      - 'You wait patiently, anticipating {target}''s next move.'
      todefender:
      - '{actor} circles dangerously.'
      - '{actor} watches you intently, waiting to strike.'
      - '{actor} holds their <ansi fg="item">{itemname}</ansi> steady, eyeing you.'
      toroom:
      - '{actor} circles {target} with cruel intentions.'
      - '{actor} waits for the right moment to attack {target}.'
      - '{actor} watches {target} carefully, ready to strike.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You thrust at {target} with your <ansi fg="item">{itemname}</ansi> but miss!'
      - 'Your attack misses as {target} dodges swiftly!'
      - 'You lunge forward with your <ansi fg="item">{itemname}</ansi>, but fail to hit {target}!'
      todefender:
      - '{actor} thrusts their <ansi fg="item">{itemname}</ansi> at you, but misses!'
      - '{actor} swings at you with their <ansi fg="item">{itemname}</ansi>, but you evade the attack!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> slices through the air, missing you entirely!'
      toroom:
      - '{actor} thrusts their <ansi fg="item">{itemname}</ansi> at {target}, but misses!'
      - '{actor} attempts to strike {target}, but fails to connect!'
      - '{actor} swings wildly at {target}, but misses!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You jab your <ansi fg="item">{itemname}</ansi> into {target} causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You lightly wound {target} with your <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> grazes {target}, causing minor damage of <ansi fg="damage">{damage}</ansi>.'
      todefender:
      - '{actor} jabs their <ansi fg="item">{itemname}</ansi> into you, causing <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} slightly wounds you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} grazes you with their <ansi fg="item">{itemname}</ansi>, causing minor damage of <ansi fg="damage">{damage}</ansi>.'
      toroom:
      - '{actor} jabs their <ansi fg="item">{itemname}</ansi> into {target}.'
      - '{actor} lightly wounds {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} grazes {target} with their <ansi fg="item">{itemname}</ansi>.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You stab {target} with your <ansi fg="item">{itemname}</ansi> and do <ansi fg="damage">{damage} damage</ansi>!'
      - 'You strike {target} with your <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> pierces {target}, inflicting <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} stabs you with their <ansi fg="item">{itemname}</ansi> and does <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} strikes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> pierces you, inflicting <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} stabs {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} strikes {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> pierces {target}!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You impale {target} with your <ansi fg="item">{itemname}</ansi>, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your powerful strike pierces deeply into {target}, dealing a significant <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a heavy blow to {target} with your <ansi fg="item">{itemname}</ansi>, inflicting <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} impales you with their <ansi fg="item">{itemname}</ansi>, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s powerful strike pierces deeply into you, dealing a significant <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} delivers a heavy blow with their <ansi fg="item">{itemname}</ansi>, inflicting <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} impales {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor}''s powerful strike pierces deeply into {target}!'
      - '{actor} delivers a heavy blow to {target} with their <ansi fg="item">{itemname}</ansi>!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY IMPALES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> to {target} with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">PIERCES THROUGH</ansi> {target} for a devastating <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY IMPALES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi>, causing you <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">DEVASTATED</ansi> by {actor}''s <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY IMPALES</ansi> {target}!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> to {target}!'
      - '{actor} <ansi fg="cyan-bold">DEVASTATES</ansi> {target} with their <ansi fg="item">{itemname}</ansi>!'
