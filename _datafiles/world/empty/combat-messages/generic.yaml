# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: generic
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You ready yourself to face {target} with your <ansi fg="item">{itemname}</ansi>.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, preparing to battle {target}.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> and focuses on you.'
      - '{actor} locks eyes with you, weapon in hand.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> against {target}.'
      - '{actor} grips their <ansi fg="item">{itemname}</ansi> and faces {target} in battle stance.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You prepare to attack {target} from a distance.'
      - 'You get ready to strike at {target} through the <ansi fg="exit">{exitname}</ansi>.'
      todefender:
      - 'You sense that someone is preparing to attack you from afar.'
      - 'You feel a hostile presence coming from the <ansi fg="exit">{entrancename}</ansi> direction.'
      toattackerroom:
      - '{actor} prepares to attack towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'A feeling of unease passes through the room.'
      - 'The air feels tense, as if a battle is about to begin.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You study {target}, looking for an opening.'
      - 'You watch {target} intently, biding your time.'
      todefender:
      - '{actor} circles you dangerously.'
      - '{actor} watches your every move.'
      - '{actor} waits for the right moment to strike.'
      toroom:
      - '{actor} circles {target} with cruel intentions.'
      - '{actor} watches {target} carefully.'
      - '{actor} seems poised to attack {target} at any moment.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You patiently wait for the right moment to attack {target} from afar.'
      - 'You keep your focus on {target}, ready to act when the time is right.'
      todefender:
      - 'An uneasy feeling washes over you.'
      - 'You sense that someone is watching you.'
      toattackerroom:
      - '{actor} waits silently, focused on a distant target.'
      - '{actor} seems lost in concentration.'
      todefenderroom:
      - 'A sense of anticipation fills the air.'
      - 'Everything feels strangely still.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You miss with your <ansi fg="item">{itemname}</ansi>.'
      - 'Your attack fails to hit {target}.'
      - 'You swing your <ansi fg="item">{itemname}</ansi>, but miss completely!'
      todefender:
      - '{actor} missed you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} swings at you but misses!'
      - '{actor}''s attack goes wide.'
      toroom:
      - '{actor} missed {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} swings at {target}, but misses.'
      - '{actor} attacks {target} but fails to connect.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack misses {target} from afar.'
      - 'You attempt to hit {target}, but your attack fails to reach.'
      todefender:
      - 'You feel a sudden rush of wind, but nothing happens.'
      - 'An attack comes your way but misses.'
      toattackerroom:
      - '{actor} attempts an attack into the distance, but misses.'
      - '{actor} attacks towards the <ansi fg="exit">{exitname}</ansi>, but nothing happens.'
      todefenderroom:
      - 'An attack seems to come from elsewhere, but fails to hit anyone.'
      - 'You hear a distant sound of an attack missing its mark.'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> barely manages to damage {target} for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a weak hit on {target} with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your attack only slightly injures {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> manages to weakly hit you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You barely feel the impact as {actor} hits you for <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} lands a weak blow on you, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> manages to weakly hit {target}.'
      - '{actor} lands a weak hit on {target}.'
      - '{actor} barely injures {target}.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your distant attack barely scratches {target} for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You manage to inflict minor damage on {target} from afar, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - 'An attack from afar slightly injures you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a slight pain as a distant attack hits you for <ansi fg="damage">{damage} damage</ansi>.'
      toattackerroom:
      - '{actor} attacks into the distance, slightly injuring someone.'
      - '{actor} lands a weak hit on a distant target.'
      todefenderroom:
      - 'A minor attack comes from elsewhere, slightly injuring {target}.'
      - '{target} winces as a distant attack causes minor damage.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> connects with {target} for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You hit {target} with your <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your attack strikes {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> connects with you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You are hit by {actor}''s attack for <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} strikes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> connects with {target}.'
      - '{actor} hits {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} strikes {target}, dealing damage.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'Your attack from afar hits {target} for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You successfully strike {target} from a distance, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - 'An attack from afar hits you for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You are struck by a distant attack, taking <ansi fg="damage">{damage} damage</ansi>.'
      toattackerroom:
      - '{actor} attacks into the distance, hitting their target.'
      - '{actor} successfully strikes a distant foe.'
      todefenderroom:
      - 'An attack comes from elsewhere, hitting {target}.'
      - '{target} is struck by a distant attack.'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You wallop {target} with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful blow to {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> hits {target} hard for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} wallops you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} smashes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard by {actor}, taking <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} wallops {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} smashes {target} with a powerful blow!'
      - '{actor} delivers a heavy hit to {target}!'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You deliver a powerful attack from afar to {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your attack from a distance hits {target} heavily for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - 'A powerful attack from afar hits you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are struck hard by a distant attack, taking <ansi fg="damage">{damage} damage</ansi>!'
      toattackerroom:
      - '{actor} launches a heavy attack into the distance.'
      - '{actor} unleashes a powerful strike towards a distant target.'
      todefenderroom:
      - 'A powerful attack comes from elsewhere, hitting {target}!'
      - '{target} is hit hard by a distant attack!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You <ansi fg="cyan-bold">CRITICALLY HIT</ansi> {target} with <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY STRIKES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a <ansi fg="cyan-bold">CRITICAL HIT</ansi> on {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} <ansi fg="cyan-bold">CRITICALLY HITS</ansi> you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s attack <ansi fg="cyan-bold">CRITICALLY STRIKES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY HIT</ansi> by {actor}, taking <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} <ansi fg="cyan-bold">CRITICALLY HITS</ansi> {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} lands a <ansi fg="cyan-bold">CRITICAL HIT</ansi> on {target}!'
      - '{actor} <ansi fg="cyan-bold">DEVASTATES</ansi> {target} with their attack!'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You <ansi fg="cyan-bold">CRITICALLY HIT</ansi> {target} from afar for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your distant attack <ansi fg="cyan-bold">CRITICALLY STRIKES</ansi> {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - 'A <ansi fg="cyan-bold">CRITICAL HIT</ansi> from afar strikes you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY STRUCK</ansi> by a distant attack, taking <ansi fg="damage">{damage} damage</ansi>!'
      toattackerroom:
      - '{actor} unleashes a devastating attack into the distance!'
      - '{actor} delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> towards a distant target!'
      todefenderroom:
      - 'A devastating attack comes from elsewhere, <ansi fg="cyan-bold">CRITICALLY HITTING</ansi> {target}!'
      - '{target} is <ansi fg="cyan-bold">CRITICALLY STRUCK</ansi> by a distant attack!'
