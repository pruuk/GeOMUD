# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: bludgeoning
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You heft your <ansi fg="item">{itemname}</ansi>, readying yourself against {target}.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing {target} for battle.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} hefts their <ansi fg="item">{itemname}</ansi>, eyeing you menacingly.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> and focuses on you.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} grips their <ansi fg="item">{itemname}</ansi> tightly, preparing to engage {target}.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi>, eyes fixed on {target}.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You circle around {target}, looking for an opening.'
      - 'You watch {target} closely, waiting for the perfect moment to strike.'
      todefender:
      - '{actor} circles dangerously.'
      - '{actor} watches you intently, their <ansi fg="item">{itemname}</ansi> at the ready.'
      - '{actor} holds their <ansi fg="item">{itemname}</ansi> steady, eyeing you carefully.'
      toroom:
      - '{actor} circles {target} with cruel intentions.'
      - '{actor} stalks around {target}, awaiting an opportunity.'
      - '{actor} eyes {target} warily, ready to strike.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You swing your <ansi fg="item">{itemname}</ansi> at {target}, but miss!'
      - 'Your swing at {target} misses completely!'
      - 'You attempt to smash {target}, but fail to connect!'
      todefender:
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> at you, but misses!'
      - '{actor} swings wildly but fails to hit you!'
      - '{actor} tries to smash you but misses!'
      toroom:
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> at {target}, but misses!'
      - '{actor} swings at {target} but misses completely.'
      - '{actor} attempts to smash {target} but fails to connect!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You heave your <ansi fg="item">{itemname}</ansi> at {target}, but it bounces off for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> barely affects {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a weak blow on {target}, dealing only <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor} heaves their <ansi fg="item">{itemname}</ansi> but does barely <ansi fg="damage">{damage} damage</ansi> to you.'
      - 'You feel a light impact as {actor} strikes you for <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} lands a weak hit on you, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor} heaves their <ansi fg="item">{itemname}</ansi> but does barely any damage to {target}.'
      - '{actor} barely affects {target} with their attack.'
      - '{actor} lands a weak blow on {target}.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You swing your <ansi fg="item">{itemname}</ansi> and hit {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> connects solidly with {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a solid blow on {target} with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> and hits you for <ansi fg="damage">{damage}</ansi>!'
      - 'You are struck by {actor}''s <ansi fg="item">{itemname}</ansi>, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} lands a solid blow on you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> and hits {target}.'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> connects with {target}!'
      - '{actor} lands a solid blow on {target}!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> lands squarely on {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful smash to {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your heavy swing hits {target} hard, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> lands squarely on you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard as {actor} smashes you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s heavy swing deals significant damage of <ansi fg="damage">{damage} damage</ansi> to you!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> lands squarely on {target}!'
      - '{actor} delivers a powerful smash to {target}!'
      - '{actor}''s heavy swing hits {target} hard!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SMASHES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL SMASH</ansi> to {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRUSHES</ansi> {target}, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SMASHES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY SMASHED</ansi> by {actor}, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRUSHES</ansi> you, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SMASHES</ansi> {target}!'
      - '{actor} delivers a <ansi fg="cyan-bold">CRITICAL SMASH</ansi> to {target}!'
      - '{actor} <ansi fg="cyan-bold">CRUSHES</ansi> {target} with a massive blow!'
