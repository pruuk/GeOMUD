# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: slashing
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, readying yourself against {target}.'
      - 'You lock eyes with {target}, your <ansi fg="item">{itemname}</ansi> poised to strike.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} raises their <ansi fg="item">{itemname}</ansi> menacingly at you.'
      - '{actor} glares at you, <ansi fg="item">{itemname}</ansi> at the ready.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} grips their <ansi fg="item">{itemname}</ansi> tightly, facing off against {target}.'
      - '{actor} locks eyes with {target}, weapon ready to strike.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You circle around {target}, looking for an opening.'
      - 'You watch {target} closely, waiting for the perfect moment.'
      todefender:
      - '{actor} circles dangerously.'
      - '{actor} watches you intently, waiting to strike.'
      - '{actor} holds their <ansi fg="item">{itemname}</ansi> steady, eyes fixed on you.'
      toroom:
      - '{actor} circles {target} with cruel intentions.'
      - '{actor} stalks around {target}, awaiting an opportunity.'
      - '{actor} eyes {target} warily, ready to strike.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You wave your <ansi fg="item">{itemname}</ansi> at {target}, to no avail!'
      - 'Your swing at {target} misses completely!'
      - 'You slash at {target} but fail to connect!'
      todefender:
      - '{actor} waves their <ansi fg="item">{itemname}</ansi> at you, but does nothing.'
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> wildly, missing you entirely.'
      - '{actor} attempts to slash you but misses!'
      toroom:
      - '{actor} waves their <ansi fg="item">{itemname}</ansi> at {target}, but does nothing.'
      - '{actor} swings at {target} but misses completely.'
      - '{actor} attempts to slash {target} but fails to connect.'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You slice at {target} with your <ansi fg="item">{itemname}</ansi> causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> grazes {target}, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a minor cut on {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor} slices you with their <ansi fg="item">{itemname}</ansi> causing <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} grazes you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a minor cut as {actor} strikes you for <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor} slices at {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} grazes {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} lands a minor cut on {target} with their <ansi fg="item">{itemname}</ansi>.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You connect with your <ansi fg="item">{itemname}</ansi>, wounding {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You slash {target} with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> cuts into {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} connects with their <ansi fg="item">{itemname}</ansi>, wounding you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} slashes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You feel a sharp pain as {actor} cuts you for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} connects with their <ansi fg="item">{itemname}</ansi>, wounding {target}!'
      - '{actor} slashes {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} cuts into {target} with their <ansi fg="item">{itemname}</ansi>!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'In a sweeping motion, you slash {target} with your <ansi fg="item">{itemname}</ansi>, doing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful blow to {target}, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> cuts deeply into {target}, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - 'In a sweeping motion, {actor} slashes you with their <ansi fg="item">{itemname}</ansi>, doing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} delivers a powerful blow, causing you <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard as {actor} cuts deeply into you for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - 'In a sweeping motion, {actor} slashes {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} delivers a powerful blow to {target}!'
      - '{actor} cuts deeply into {target} with their <ansi fg="item">{itemname}</ansi>!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY LACERATES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> to {target} with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">TEARS THROUGH</ansi> {target}, dealing a devastating <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY LACERATES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi>, causing you <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">DEVASTATED</ansi> by {actor}''s <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY LACERATES</ansi> {target}!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL STRIKE</ansi> to {target}!'
      - '{actor} <ansi fg="cyan-bold">DEVASTATES</ansi> {target} with their <ansi fg="item">{itemname}</ansi>!'
