      - 'A strong shot from the <ansi fg="exit">{entrancename}</ansi> hits {target}.'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SNIPES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
