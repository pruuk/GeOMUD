      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SNIPES</ansi> {target}!'
      - '{actor}''s shot delivers a <ansi fg="cyan-bold">CRITICAL HIT</ansi> to {target}!'
      - '{actor} <ansi fg="cyan-bold">DEVASTATES</ansi> {target} with their <ansi fg="item">{itemname}</ansi>!'
