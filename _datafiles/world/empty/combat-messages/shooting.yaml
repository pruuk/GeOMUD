# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: shooting
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You ready your <ansi fg="item">{itemname}</ansi> against {target}.'
      - 'You take aim at {target}, preparing to attack.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} levels their <ansi fg="item">{itemname}</ansi> at you, eyes filled with intent.'
      - '{actor} takes aim at you with their <ansi fg="item">{itemname}</ansi>.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> against {target}.'
      - '{actor} takes aim at {target} with their <ansi fg="item">{itemname}</ansi>.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You prepare to attack {target} through the <ansi fg="exit">{exitname}</ansi> direction.'
      - 'You ready your <ansi fg="item">{itemname}</ansi>, aiming towards the <ansi fg="exit">{exitname}</ansi> direction at {target}.'
      - 'You take position to shoot at {target} through the <ansi fg="exit">{exitname}</ansi>.'
      todefender:
      - 'Someone... or something, is aiming at you from the <ansi fg="exit">{entrancename}</ansi> direction.'
      - 'You sense danger coming from the <ansi fg="exit">{entrancename}</ansi> direction.'
      - 'A feeling of being watched comes from the <ansi fg="exit">{entrancename}</ansi> direction.'
      toattackerroom:
      - '{actor} prepares to attack towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> aiming towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} takes aim through the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You steady your <ansi fg="item">{itemname}</ansi>, focusing on {target}.'
      - 'You take a deep breath and line up your shot at {target}.'
      todefender:
      - '{actor} aims carefully.'
      - '{actor} fixes their gaze on you, weapon ready.'
      - '{actor} points their <ansi fg="item">{itemname}</ansi> in your direction.'
      toroom:
      - '{actor} aims carefully at {target}.'
      - '{actor} steadies their aim at {target}.'
      - '{actor} focuses intently on {target} with their <ansi fg="item">{itemname}</ansi>.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You aim carefully at {target} through the <ansi fg="exit">{exitname}</ansi> direction.'
      - 'You steady your aim towards the <ansi fg="exit">{exitname}</ansi>, targeting {target}.'
      - 'You line up your shot through the <ansi fg="exit">{exitname}</ansi> direction at {target}.'
      todefender:
      - 'The hair on the back of your neck stands up.'
      - 'A sudden chill runs down your spine.'
      - 'You feel as if someone is watching you from the <ansi fg="exit">{entrancename}</ansi> direction.'
      toattackerroom:
      - '{actor} aims carefully towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} steadies their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi>.'
      - '{actor} focuses intently towards the <ansi fg="exit">{exitname}</ansi> direction.'
      todefenderroom:
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You fire your <ansi fg="item">{itemname}</ansi> at {target}, to no avail!'
      - 'Your shot at {target} misses completely!'
      - 'You pull the trigger, but your shot goes wide of {target}!'
      todefender:
      - '{actor} fires a shot from their <ansi fg="item">{itemname}</ansi> at you, but misses by a mile.'
      - '{actor} shoots at you but fails to hit.'
      - 'A shot from {actor} whizzes past you!'
      toroom:
      - '{actor} fires a shot from their <ansi fg="item">{itemname}</ansi> at {target}, but misses by a mile.'
      - '{actor} shoots at {target} but misses completely.'
      - 'A shot from {actor} flies past {target} harmlessly.'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You fire your <ansi fg="item">{itemname}</ansi> through the <ansi fg="exit">{exitname}</ansi> direction, but miss {target}!'
      - 'Your shot towards {target} through the <ansi fg="exit">{exitname}</ansi> misses!'
      - 'You pull the trigger, but your shot through the <ansi fg="exit">{exitname}</ansi> fails to hit {target}.'
      todefender:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi> direction, but misses you!'
      - 'A projectile whizzes past you from the <ansi fg="exit">{entrancename}</ansi> direction!'
      - 'You hear a shot from the <ansi fg="exit">{entrancename}</ansi> direction, but it misses.'
      toattackerroom:
      - '{actor} fires their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} shoots through the <ansi fg="exit">{exitname}</ansi> but seems to miss.'
      - '{actor} fires a shot towards the <ansi fg="exit">{exitname}</ansi> direction, but nothing happens.'
      todefenderroom:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi> direction, barely missing {target}.'
      - 'A projectile flies in from the <ansi fg="exit">{entrancename}</ansi>, missing {target} by inches.'
      - 'A shot from the <ansi fg="exit">{entrancename}</ansi> direction sails past {target}.'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You fire at {target} with your <ansi fg="item">{itemname}</ansi> causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your shot grazes {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You manage to wound {target} with your <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor} fires at you with their <ansi fg="item">{itemname}</ansi> causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a sting as {actor} grazes you with a shot for <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} wounds you slightly with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor} lands a shot on {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} wounds {target} with a glancing shot.'
      - '{actor} fires at {target}, causing a minor injury.'
