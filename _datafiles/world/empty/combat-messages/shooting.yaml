    separate:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SNIPES</ansi> {target} through the <ansi fg="exit">{exitname}</ansi> direction for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL HIT</ansi> to {target} through the <ansi fg="exit">{exitname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your shot <ansi fg="cyan-bold">PIERCES</ansi> {target} through the <ansi fg="exit">{exitname}</ansi>, dealing a devastating <ansi fg="damage">{damage} damage</ansi>!'
