      - '{actor} fires their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} fires a critical shot through the <ansi fg="exit">{exitname}</ansi>.'
      - '{actor} delivers a devastating shot towards the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi>, and <ansi fg="cyan-bold">CRITICALLY SNIPES</ansi> {target}.'
      - 'A shot from the <ansi fg="exit">{entrancename}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL HIT</ansi> to {target}!'
      - '{target} is <ansi fg="cyan-bold">DEVASTATED</ansi> by a shot from the <ansi fg="exit">{entrancename}</ansi>!'
