    separate:
      toattacker:
      - 'You fire at {target} through the <ansi fg="exit">{exitname}</ansi> direction, doing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your shot through the <ansi fg="exit">{exitname}</ansi> grazes {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You manage to hit {target} through the <ansi fg="exit">{exitname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi> direction, hitting you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are grazed by a shot from the <ansi fg="exit">{entrancename}</ansi> direction, taking <ansi fg="damage">{damage} damage</ansi>!'
      - 'A projectile from the <ansi fg="exit">{entrancename}</ansi> wounds you for <ansi fg="damage">{damage} damage</ansi>.'
      toattackerroom:
      - '{actor} fires their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} shoots through the <ansi fg="exit">{exitname}</ansi>, attempting to hit {target}.'
      - '{actor} fires a shot towards the <ansi fg="exit">{exitname}</ansi>.'
      todefenderroom:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi>, hitting {target}.'
      - 'A projectile flies in from the <ansi fg="exit">{entrancename}</ansi>, grazing {target}.'
      - 'A shot from the <ansi fg="exit">{entrancename}</ansi> direction wounds {target}.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You fire your <ansi fg="item">{itemname}</ansi>, wounding {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your shot hits {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You successfully wound {target} with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} fires their <ansi fg="item">{itemname}</ansi>, wounding you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit by {actor}''s shot, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} wounds you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} fires their <ansi fg="item">{itemname}</ansi>, wounding {target}!'
      - '{actor}''s shot hits {target}, dealing damage!'
      - '{actor} wounds {target} with their <ansi fg="item">{itemname}</ansi>!'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'You fire through the <ansi fg="exit">{exitname}</ansi> direction, wounding {target} for <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your shot through the <ansi fg="exit">{exitname}</ansi> hits {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You successfully wound {target} through the <ansi fg="exit">{exitname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi> direction, wounding you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit by a shot from the <ansi fg="exit">{entrancename}</ansi> direction, taking <ansi fg="damage">{damage} damage</ansi>!'
      - 'A projectile from the <ansi fg="exit">{entrancename}</ansi> wounds you for <ansi fg="damage">{damage} damage</ansi>!'
      toattackerroom:
      - '{actor} fires their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} shoots through the <ansi fg="exit">{exitname}</ansi>, hitting their target.'
      - '{actor} fires a shot towards the <ansi fg="exit">{exitname}</ansi>, dealing damage.'
      todefenderroom:
      - 'A shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi>, wounding {target}.'
      - 'A projectile from the <ansi fg="exit">{entrancename}</ansi> hits {target}, causing damage.'
      - 'A shot from the <ansi fg="exit">{entrancename}</ansi> wounds {target}.'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'In a moment of clarity, you fire at {target} with your <ansi fg="item">{itemname}</ansi>, doing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a powerful shot on {target}, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> hits {target} squarely, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - 'With incredible accuracy, {actor} wounds you with their <ansi fg="item">{itemname}</ansi>, doing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are struck hard by {actor}, taking an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s shot hits you with force, dealing <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - 'With incredible accuracy, {actor} wounds {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} lands a powerful shot on {target}!'
      - '{actor}''s shot hits {target} squarely, dealing significant damage!'
    # messages for when they are in different rooms, such as with projectiles
    separate:
      toattacker:
      - 'In a moment of clarity, you fire through the <ansi fg="exit">{exitname}</ansi> direction, doing an impressive <ansi fg="damage">{damage} damage</ansi> to {target}!'
      - 'You land a powerful shot on {target} through the <ansi fg="exit">{exitname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your shot through the <ansi fg="exit">{exitname}</ansi> hits {target} squarely, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - 'With incredible accuracy, a shot from a <ansi fg="item">{itemname}</ansi> flies in from the <ansi fg="exit">{entrancename}</ansi> direction, hitting you for an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are struck hard by a shot from the <ansi fg="exit">{entrancename}</ansi>, taking an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'A projectile from the <ansi fg="exit">{entrancename}</ansi> hits you with force, dealing <ansi fg="damage">{damage} damage</ansi>!'
      toattackerroom:
      - '{actor} fires their <ansi fg="item">{itemname}</ansi> towards the <ansi fg="exit">{exitname}</ansi> direction.'
      - '{actor} shoots through the <ansi fg="exit">{exitname}</ansi>, hitting their target powerfully.'
      - '{actor} fires a strong shot towards the <ansi fg="exit">{exitname}</ansi>.'
