      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY SNIPES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> delivers a <ansi fg="cyan-bold">CRITICAL HIT</ansi>, causing you <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">DEVASTATED</ansi> by {actor}''s shot for <ansi fg="damage">{damage} damage</ansi>!'
