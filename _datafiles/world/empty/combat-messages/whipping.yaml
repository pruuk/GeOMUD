# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'whip'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: whipping
options:
  prepare:
    together:
      toattacker:
      - 'You unfurl your <ansi fg="item">{itemname}</ansi> and prepare to whip {target}.'
      - 'You grip your <ansi fg="item">{itemname}</ansi> tightly, eyeing {target} for an attack.'
      - 'You get ready to strike {target} with your <ansi fg="item">{itemname}</ansi>.'
      todefender:
      - '{actor} unfurls their <ansi fg="item">{itemname}</ansi> and prepares to whip you.'
      - '{actor} eyes you menacingly, gripping their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} prepares to strike you with their <ansi fg="item">{itemname}</ansi>.'
      toroom:
      - '{actor} unfurls their <ansi fg="item">{itemname}</ansi> and prepares to attack {target}.'
      - '{actor} grips their <ansi fg="item">{itemname}</ansi>, focusing on {target}.'
      - '{actor} readies their <ansi fg="item">{itemname}</ansi> to strike {target}.'
  wait:
    together:
      toattacker:
      - 'You snap your <ansi fg="item">{itemname}</ansi> menacingly at {target}.'
      - 'You circle around {target}, <ansi fg="item">{itemname}</ansi> at the ready.'
      - 'You watch for an opening to strike {target} with your <ansi fg="item">{itemname}</ansi>.'
      todefender:
      - '{actor} snaps their <ansi fg="item">{itemname}</ansi> dangerously.'
      - '{actor} circles you, <ansi fg="item">{itemname}</ansi> poised to strike.'
      - '{actor} watches you carefully, their <ansi fg="item">{itemname}</ansi> ready.'
      toroom:
      - '{actor} snaps their <ansi fg="item">{itemname}</ansi> at {target} with cruel intentions.'
      - '{actor} circles {target}, <ansi fg="item">{itemname}</ansi> in hand.'
      - '{actor} eyes {target}, readying their <ansi fg="item">{itemname}</ansi> for an attack.'
  miss:
    together:
      toattacker:
      - 'You lash out at {target} with your <ansi fg="item">{itemname}</ansi> but miss!'
      - 'You swing your <ansi fg="item">{itemname}</ansi> at {target}, but they dodge!'
      - 'Your attempt to whip {target} fails as you miss!'
      todefender:
      - '{actor} lashes their <ansi fg="item">{itemname}</ansi> at you, but misses!'
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> at you, but you evade!'
      - '{actor} tries to whip you but misses!'
      toroom:
      - '{actor} lashes their <ansi fg="item">{itemname}</ansi> at {target}, but misses!'
      - '{actor} swings their <ansi fg="item">{itemname}</ansi> at {target}, but fails to connect!'
      - '{actor} tries to whip {target}, but misses!'
  weak:
    together:
      toattacker:
      - 'You flick your <ansi fg="item">{itemname}</ansi> at {target}, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You land a light strike on {target} with your <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your <ansi fg="item">{itemname}</ansi> grazes {target}, inflicting <ansi fg="damage">{damage} damage</ansi>.'
      todefender:
      - '{actor} flicks their <ansi fg="item">{itemname}</ansi> at you, causing <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} lands a light strike on you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} grazes you with their <ansi fg="item">{itemname}</ansi>, inflicting <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor} flicks their <ansi fg="item">{itemname}</ansi> at {target}.'
      - '{actor} lands a light strike on {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} grazes {target} with their <ansi fg="item">{itemname}</ansi>.'
  normal:
    together:
      toattacker:
      - 'You whip {target} with your <ansi fg="item">{itemname}</ansi> and deal <ansi fg="damage">{damage} damage</ansi>!'
      - 'You strike {target} squarely with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> snaps against {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} whips you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} strikes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} snaps their <ansi fg="item">{itemname}</ansi> against you, dealing <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} whips {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} strikes {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} snaps their <ansi fg="item">{itemname}</ansi> against {target}!'
  heavy:
    together:
      toattacker:
      - 'You deliver a powerful lash to {target} with your <ansi fg="item">{itemname}</ansi>, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - 'You unleash a heavy strike on {target} with your <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> cracks loudly against {target}, inflicting <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} delivers a powerful lash to you with their <ansi fg="item">{itemname}</ansi>, causing an impressive <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} unleashes a heavy strike on you with their <ansi fg="item">{itemname}</ansi>, dealing <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} cracks their <ansi fg="item">{itemname}</ansi> loudly against you, inflicting <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} delivers a powerful lash to {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} unleashes a heavy strike on {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} cracks their <ansi fg="item">{itemname}</ansi> loudly against {target}!'
  critical:
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRACKS VIOLENTLY</ansi> against {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You land a <ansi fg="cyan-bold">DEVASTATING WHIP</ansi> on {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">STRIKES WITH GREAT FORCE</ansi>, dealing <ansi fg="damage">{damage} damage</ansi> to {target}!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRACKS VIOLENTLY</ansi> against you for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} lands a <ansi fg="cyan-bold">DEVASTATING WHIP</ansi> on you, causing <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">STRIKES WITH GREAT FORCE</ansi>, dealing <ansi fg="damage">{damage} damage</ansi> to you!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRACKS VIOLENTLY</ansi> against {target}!'
      - '{actor} lands a <ansi fg="cyan-bold">DEVASTATING WHIP</ansi> on {target}!'
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">STRIKES WITH GREAT FORCE</ansi> against {target}!'
