# Possible tokens: 
# {itemname}    - name of weapon/object e.g. 'sword'
# {actor}       - the attacker's name, coloured per receiver by messaging
# {target}      - the defender's name, coloured per receiver by messaging
# {damage}      - damage dealt as an integer e.g. '5'
# {exitname}    - name of exit for attack e.g. 'north'
# {entrancename}- name of entrance for attack e.g. 'south'
optionid: claws
options:
  prepare:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You prepare to enter into mortal combat with {target}.'
      - 'You flex your <ansi fg="item">{itemname}</ansi> menacingly at {target}.'
      - 'You let out a low growl, preparing to pounce on {target}.'
      todefender:
      - '{actor} prepares to fight you with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} flexes their <ansi fg="item">{itemname}</ansi> menacingly at you.'
      - '{actor} lets out a low growl, preparing to pounce on you.'
      toroom:
      - '{actor} prepares to attack {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} flexes their <ansi fg="item">{itemname}</ansi>, readying to strike {target}.'
      - '{actor} lets out a low growl, preparing to pounce on {target}.'
  wait:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You aim carefully at {target}.'
      - 'You circle around {target}, claws at the ready.'
      - 'You watch {target} intently, waiting for the perfect moment to strike.'
      todefender:
      - '{actor} circles dangerously.'
      - '{actor} circles around you, claws at the ready.'
      - '{actor} watches you intently, ready to pounce.'
      toroom:
      - '{actor} circles {target} with cruel intentions.'
      - '{actor} prowls around {target}, claws poised to strike.'
      - '{actor} watches {target} intently, ready to pounce.'
  miss:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'You swipe at {target} with your <ansi fg="item">{itemname}</ansi>, but miss!'
      - 'Your claws slash through the air as {target} dodges your attack!'
      - 'You lunge at {target}, but fail to make contact!'
      todefender:
      - '{actor} swipes at you with their <ansi fg="item">{itemname}</ansi> but misses.'
      - '{actor}''s claws slash through the air as you dodge their attack!'
      - '{actor} lunges at you, but fails to make contact!'
      toroom:
      - '{actor} swipes at {target} with their <ansi fg="item">{itemname}</ansi>, but misses.'
      - '{actor}''s claws slash through the air as {target} dodges the attack!'
      - '{actor} lunges at {target}, but fails to make contact!'
  weak:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> grazes {target} for <ansi fg="damage">{damage} damage</ansi>.'
      - 'You scratch {target} lightly with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'Your claws barely nick {target}, dealing minor damage of <ansi fg="damage">{damage}</ansi>.'
      todefender:
      - '{actor} grazes you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>.'
      - '{actor} scratches you lightly with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>.'
      - 'You feel a slight scratch as {actor}''s claws barely nick you for <ansi fg="damage">{damage} damage</ansi>.'
      toroom:
      - '{actor} grazes {target} with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor} scratches {target} lightly with their <ansi fg="item">{itemname}</ansi>.'
      - '{actor}''s claws barely nick {target}, causing minor damage.'
  normal:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> rends {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You slash {target} with your <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your claws tear into {target}, dealing <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor} rends you with their <ansi fg="item">{itemname}</ansi> for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor} slashes you with their <ansi fg="item">{itemname}</ansi>, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You feel sharp pain as {actor}''s claws tear into you for <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor} rends {target} with their <ansi fg="item">{itemname}</ansi>!'
      - '{actor} slashes {target} with their claws!'
      - '{actor}''s claws tear into {target}!'
  heavy:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> bites into {target} causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a powerful slash to {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your claws sink deeply into {target}, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> bites into you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are hit hard as {actor} delivers a powerful slash for <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s claws sink deeply into you, dealing significant damage of <ansi fg="damage">{damage}</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> bites into {target}!'
      - '{actor} delivers a powerful slash to {target}!'
      - '{actor}''s claws sink deeply into {target}!'
  critical:
    # messages for when they are in the same room
    together:
      toattacker:
      - 'Your <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY EVISCERATES</ansi> {target} for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You deliver a <ansi fg="cyan-bold">CRITICAL REND</ansi> to {target}, causing <ansi fg="damage">{damage} damage</ansi>!'
      - 'Your claws <ansi fg="cyan-bold">DEVASTATE</ansi> {target}, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      todefender:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY EVISCERATES</ansi> you for <ansi fg="damage">{damage} damage</ansi>!'
      - 'You are <ansi fg="cyan-bold">CRITICALLY RENDED</ansi> by {actor}, taking <ansi fg="damage">{damage} damage</ansi>!'
      - '{actor}''s claws <ansi fg="cyan-bold">DEVASTATE</ansi> you, dealing a massive <ansi fg="damage">{damage} damage</ansi>!'
      toroom:
      - '{actor}''s <ansi fg="item">{itemname}</ansi> <ansi fg="cyan-bold">CRITICALLY EVISCERATES</ansi> {target}!'
      - '{actor} delivers a <ansi fg="cyan-bold">CRITICAL REND</ansi> to {target}!'
      - '{actor}''s claws <ansi fg="cyan-bold">DEVASTATE</ansi> {target}!'
